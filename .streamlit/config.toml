[theme]
# Gelap, bukan hitam murni: hitam murni mematikan kesan kedalaman di balik
# peta dan kartu. Nilai-nilai ini sama dengan token di src/config.py.
base = "dark"
primaryColor = "#C98500"
backgroundColor = "#0F1318"
secondaryBackgroundColor = "#1A2029"
textColor = "#E8E4DE"
borderColor = "#2A313B"
font = "sans serif"
headingFont = "sans serif"
baseRadius = "small"
showWidgetBorder = true

[server]
headless = true

[client]
toolbarMode = "minimal"
